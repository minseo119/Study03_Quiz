<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>상식 퀴즈</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%3F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <p class="student" id="student-info">학번 2601914 이름 강민서</p>

    <!-- 시작 화면 -->
    <section id="screen-start">
      <h1>상식 퀴즈</h1>
      <p class="lead">카테고리를 고르세요. 한 판은 10문제입니다.</p>
      <div id="category-buttons" class="stack"></div>
      <p id="data-error" class="error" hidden></p>
    </section>

    <!-- 모드 선택 화면 -->
    <section id="screen-mode" hidden>
      <h2 id="mode-title"></h2>
      <div id="mode-buttons" class="stack"></div>
      <div class="row">
        <button id="back-button" type="button">뒤로</button>
      </div>
    </section>

    <!-- 문제 화면 -->
    <section id="screen-quiz" hidden>
      <header class="quiz-bar">
        <span id="quiz-title"></span>
        <span id="quiz-progress"></span>
        <span id="quiz-score"></span>
        <span id="quiz-timer" class="timer" hidden></span>
      </header>
      <h2 id="quiz-question" class="question"></h2>
      <div id="quiz-choices" class="stack"></div>
      <button id="hint-button" class="hint-button" type="button" hidden>힌트 (오답 2개 지우기)</button>
      <div id="quiz-feedback" class="feedback" hidden>
        <p id="feedback-verdict" class="verdict"></p>
        <p id="feedback-explanation"></p>
        <p class="source">출처: <a id="feedback-source" target="_blank" rel="noopener"></a></p>
        <button id="next-button" class="primary" type="button">다음</button>
      </div>
    </section>

    <!-- 결과 화면 -->
    <section id="screen-result" hidden>
      <p id="result-title" class="muted"></p>
      <p id="result-score" class="big"></p>
      <p id="result-note" class="note"></p>
      <ol id="result-list" class="result-list"></ol>
      <div class="row">
        <button id="retry-button" class="primary" type="button" hidden>틀린 문제 다시 풀기</button>
        <button id="again-button" class="primary" type="button">같은 모드 다시</button>
        <button id="home-button" type="button">처음으로</button>
      </div>
    </section>
  </main>

  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
